name: Staging gate

on:
  pull_request:
  push:
    branches:
      - main
      - feature/procurement-foundation
  workflow_dispatch:

concurrency:
  group: staging-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oqood
          POSTGRES_PASSWORD: oqood_ci_password
          POSTGRES_DB: oqood_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oqood -d oqood_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://oqood:oqood_ci_password@localhost:5432/oqood_ci
      DIRECT_DATABASE_URL: postgresql://oqood:oqood_ci_password@localhost:5432/oqood_ci
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      APP_ALLOWED_ORIGINS: http://localhost:3000
      DOCUMENT_STORAGE_ROOT: /tmp/oqood-ci-documents
      STAGING_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oqood/platform db:generate

      - name: Apply migrations
        run: pnpm --filter @oqood/platform db:deploy

      - name: Typecheck
        run: pnpm --filter @oqood/platform typecheck

      - name: Test
        run: pnpm --filter @oqood/platform test

      - name: Build
        run: pnpm --filter @oqood/platform build

      - name: Start application
        run: |
          pnpm --filter @oqood/platform start > /tmp/oqood-staging.log 2>&1 &
          echo $! > /tmp/oqood-staging.pid

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/oqood-staging.log
          exit 1

      - name: Smoke test
        run: pnpm --filter @oqood/platform smoke:staging

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-server-log
          path: /tmp/oqood-staging.log
          if-no-files-found: ignore
          retention-days: 7
